spring.application.name=vivaeventos-orders
app.version=0.1.0
app.api.version=v1

server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/vivaeventos_orders}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devdb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:a1b2c3d4}

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw}

services.tickets.url=${SERVICES_TICKETS_URL:http://tickets:8085}
services.audit.url=${SERVICES_AUDIT_URL:http://audit:8089}

management.server.port=${MANAGEMENT_SERVER_PORT:-1}
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ── Trazabilidad distribuida (Micrometer Tracing + Zipkin) ──────
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.0}
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:}
